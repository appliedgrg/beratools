name: Build Windows Installer

on:
  push:
    branches:
      - '**'
    tags:
      - '*.*.*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Print working directory
        run: pwd
        shell: pwsh

      - name: Fetch all tags
        run: git fetch --tags
        shell: pwsh

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('packaging/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Install Inno Setup
        run: |
          choco install innosetup -y
        shell: pwsh

      - name: Build installer
        run: |
          powershell -ExecutionPolicy Bypass -File packaging/build.ps1
        shell: pwsh
        working-directory: ${{ github.workspace }}

      - name: List dist directory contents
        run: ls packaging/dist
        shell: pwsh

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: beratools-installer
          path: packaging/dist/beratools-installer-*.exe
          if-no-files-found: error

      - name: Get latest tag
        id: get_tag
        run: |
          $tag = git describe --tags --abbrev=0 2>$null
          if (-not $tag) {
            Write-Host "No tags found, skipping release"
            echo "tag=" >> $env:GITHUB_OUTPUT
          } else {
            Write-Host "Latest tag: $tag"
            echo "tag=$tag" >> $env:GITHUB_OUTPUT
          }
        shell: pwsh

      - name: Upload to release
        if: steps.get_tag.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_tag.outputs.tag }}
          files: packaging/dist/beratools-installer-*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
