name: Publish to PyPI Test

on:
  pull_request:
    branches: 
      - main
    paths:
      - 'pyproject.toml'
      - 'README.md'
      - 'LICENSE'
      - '.gchithub/workflows/publish_to_pypi_test.yml'

jobs:
  testpypi:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0  # Fetch all history for hatch-vcs
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install build tools
        run: pip install build twine hatch-vcs
      
      - name: Build package
        run: python -m build

      - name: List built distributions
        run: ls -la dist/

      - name: Validate distributions with twine
        run: python -m twine check --strict dist/*

      - name: Show wheel metadata
        run: |
          python -m pip install --upgrade pkginfo
          python - <<'PY'
          import glob
          import pkginfo

          wheels = glob.glob('dist/*.whl')
          for wheel in wheels:
              print(f"==== {wheel} ====")
              meta = pkginfo.Wheel(wheel)
              print(f"Name: {meta.name}")
              print(f"Version: {meta.version}")
              print(f"Summary: {meta.summary}")
              print(f"Requires Python: {meta.requires_python}")
              print(f"Classifiers: {meta.classifiers}")
              print(f"Metadata version: {meta.metadata_version}")
          PY
      
      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          verbose: true
          skip-existing: true
