[workspace]
authors = ["Richard <502763+RichardQZeng@users.noreply.github.com>"]
channels = ["nodefaults", "appliedgrg", "conda-forge"]
description = "BERA Tools is toolset to extract and assess line features in forest"
name = "bera"
platforms = ["win-64", "linux-64"]
version = "0.1.0"

[tasks]
main_tk = "python main.py"
main = "python ./beratools/gui/main.py"

[dependencies]
python = "3.12.*"
dask = "*"
gdal = ">=3.12,<4"
geopandas = "*"
networkit = "*"
numpy = ">=1.26,<2.4"
pyarrow = "*"
pyogrio = ">=0.9.0"
pygments = ">=2.20"
pyqt = "*"
rasterio = "*"
scikit-image = ">=0.24.0"
tabulate = "*"
tqdm = "*"
xarray-spatial = "*"
pytest = "*"
pytest-qt = "*"
pytest-cov = "*"
coverage = "*"
pandarallel = "1.6.*"

[pypi-dependencies]
hatch-vcs = "*"
beratools = { path = ".", editable = true }
zensical = "==0.0.53"
mkdocstrings = "*"
mkdocstrings-python = "*"
pymdown-extensions = "*"
